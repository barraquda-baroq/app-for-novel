name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            connector/package-lock.json
      - run: npm ci
      # Claude 用のコネクタ（アプリの src/domain・src/claude などをまとめて使うので、アプリと一緒に確かめる。
      # 同期の E2E の e2e/pairing.sync.spec.ts も、これが無いと本物のコネクタを動かせない）
      - run: npm --prefix connector ci
      - name: 型チェック
        run: npx tsc -b --noEmit
      - name: コネクタの型チェック
        run: npm --prefix connector run typecheck
      - name: 単体テスト
        run: npm test
      - name: コネクタのテスト（単体・Workers の実行環境・公開する形の確かめ）
        run: npm run test:connector
      # Firebase エミュレーター（firebase-tools 15）は Java 21 以上が要る（ランナーの既定は 17）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firebase エミュレーターのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: 同期のテスト（Firebase エミュレーター）
        run: npm run test:sync
      - name: コネクタの結合テスト（Firebase エミュレーター）
        run: npm run test:connector:emu
      - name: ビルド
        run: npm run build
      - name: E2E テスト用ブラウザ
        run: npx playwright install --with-deps chromium webkit
      # E2E_WEBKIT: iPhone のアプリのキーボードの配置（e2e/native-keyboard.spec.ts）を WebKit でも確かめる
      - name: E2E テスト
        run: npm run test:e2e
        env:
          E2E_WEBKIT: '1'
      - name: 同期の E2E テスト（Firebase エミュレーター）
        run: npm run test:e2e:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/artifacts
          retention-days: 7
