name: CI

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            connector/package-lock.json
      - run: npm ci
      # Claude 用のコネクタ（アプリの src/domain・src/claude などをまとめて使うので、アプリと一緒に確かめる。
      # 同期の E2E の e2e/pairing.sync.spec.ts も、これが無いと本物のコネクタを動かせない）
      - run: npm --prefix connector ci
      - name: 型チェック
        run: npx tsc -b --noEmit
      - name: コネクタの型チェック
        run: npm --prefix connector run typecheck
      - name: 単体テスト
        run: npm test
      - name: コネクタのテスト（単体・Workers の実行環境・公開する形の確かめ）
        run: npm run test:connector
      # Firebase エミュレーター（firebase-tools 15）は Java 21 以上が要る（ランナーの既定は 17）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firebase エミュレーターのキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - name: 同期のテスト（Firebase エミュレーター）
        run: npm run test:sync
      - name: コネクタの結合テスト（Firebase エミュレーター）
        run: npm run test:connector:emu
      - name: ビルド
        run: npm run build
      # アプリでだけ使うログインのプラグインの Web 版の実装が、Web 版の Firebase のチャンクに入っていないこと（src/platform/nativeAuth.ts）
      - name: Web 版の中身の確かめ
        run: node scripts/check-web-bundle.mjs
      - name: E2E テスト用ブラウザ
        run: npx playwright install --with-deps chromium webkit
      # E2E_WEBKIT: iPhone のアプリのキーボードの配置（e2e/native-keyboard.spec.ts）を WebKit でも確かめる
      - name: E2E テスト
        run: npm run test:e2e
        env:
          E2E_WEBKIT: '1'
      - name: 同期の E2E テスト（Firebase エミュレーター）
        run: npm run test:e2e:sync
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: e2e/artifacts
          retention-days: 7

  # 2.4 Android アプリ（Capacitor）のビルド。google-services.json・署名の鍵が無くてもビルドできることと、
  # 版（package.json → versionCode）・署名の設定（keystore.properties）が効くことを確かめる（docs/MOBILE.md）
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Capacitor 8 とプラグインは Java 21 でコンパイルする（Android Studio に入っている JBR と同じ）
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: アプリの画面をビルド（サービスワーカーなし）
        run: npm run build:native
      - name: Android のプロジェクトに写す
        run: npx cap sync android
      - name: Android のビルド（鍵なし）
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
      - name: 版の確かめ
        run: node scripts/mobile/ci.mjs android-version android/app/build/outputs/apk/debug/app-debug.apk
      - name: 署名の確かめ（使い捨ての鍵で keystore.properties を作ってビルドする）
        run: |
          node scripts/mobile/ci.mjs android-keystore "$RUNNER_TEMP/ci-release.jks"
          (cd android && ./gradlew assembleRelease --no-daemon)
          node scripts/mobile/ci.mjs android-signature android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ci-release.jks"
          rm -f android/keystore.properties "$RUNNER_TEMP/ci-release.jks"

  # 2.4 iPhone アプリのビルド（シミュレーター用、署名なし）。Google ログインの設定の確かめ（Run Script）と、
  # 版・最低の iOS（ios/App/novelstudio.xcconfig）・手元の設定（local.xcconfig）の読み込みを確かめる
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Xcode
        run: xcodebuild -version
      - name: アプリの画面をビルド（サービスワーカーなし）
        run: npm run build:native
      - name: iPhone のプロジェクトに写す
        run: npx cap sync ios
      # 本物の GoogleService-Info.plist はリポジトリに入れない（npm run mobile:firebase が作る）。CI は中身のないものを使う
      - name: CI 用の GoogleService-Info.plist
        run: cp ios/ci/GoogleService-Info.ci.plist ios/App/App/GoogleService-Info.plist
      - name: Swift Package のキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/App/CapApp-SPM/Package.swift', 'package-lock.json') }}
          restore-keys: spm-${{ runner.os }}-
      # xcodebuild の引数は scripts/mobile/ci.mjs（シミュレーター用・署名なし。GOOGLE_REVERSED_CLIENT_ID は CI 用の値）
      - name: iPhone のビルド（シミュレーター）
        run: node scripts/mobile/ci.mjs ios-build
      - name: できたアプリの確かめ（版・URL スキーム・プライバシーの宣言・サービスワーカーなし）
        run: node scripts/mobile/ci.mjs ios-app "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
      - name: xcconfig の読み込みの確かめ（Debug・Release、local.xcconfig のあり・なし）
        run: node scripts/mobile/ci.mjs ios-settings
      - name: Google ログインの設定が無い時に止まることの確かめ
        run: node scripts/mobile/ci.mjs ios-missing-google
      # Mac の Product > Archive に近い形（実機用・Release。署名だけしない）
      - name: iPhone のビルド（実機用・Release）
        run: node scripts/mobile/ci.mjs ios-build-device
