<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Novel Studio</title>
    <!--
      最初の描画の前に外観（ホワイト／ダーク／ディープダーク）を決め、暗い外観で白い画面が一瞬出ないようにする。起動アニメーションもここで始める。
      src/launch/launch.js を、開発サーバーでもビルドでもこの script の先頭にそのまま埋め込む（vite.config.ts の inlineLaunchScript。
      アプリの本体の読み込みを待たず、読み込みも増やさない）。起動後の外観は src/ui/Layout.tsx の PrefsEffect が同じ規則で反映する
    -->
    <script data-inline="src/launch/launch.js">
      NovelStudioLaunch.boot()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
